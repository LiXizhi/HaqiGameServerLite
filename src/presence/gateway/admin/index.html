<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在场网关</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<header class="top">
    <div>
        <h1>在场网关</h1>
        <p>管理已注册的世界服务器。游戏服不保存玩家档案，只同步同一房间里的外观和移动。</p>
    </div>
    <div class="tools">
        <label>管理口令 <input id="token" type="password" autocomplete="off"></label>
        <button id="add-server" type="button">增加本机世界服</button>
        <button id="pause" type="button">暂停自动平衡</button>
        <button id="refresh" type="button">刷新</button>
    </div>
</header>
<section id="summary" class="summary"></section>
<section><h2>用户日报（北京时间）</h2><label>日期 <input id="report-date" type="date"></label> <button id="load-report" type="button">查看日报</button><p>留空查看今日实时数据；每天零点后自动生成前一天日报。仅统计已鉴权并成功入场的账号。</p><div id="report-summary"></div><canvas id="online-chart" width="960" height="240" style="max-width:100%" aria-label="分钟在线账号曲线"></canvas><p>横轴：00:00—24:00；纵轴：在线账号数。断线表示缺失采样。</p></section>
<section id="machines"></section>
<section>
    <h2>最近平衡</h2>
    <ol id="history"></ol>
</section>
<script src="/admin/admin.js"></script>
</body>
</html>
